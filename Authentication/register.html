<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar conta · VideoTool</title>
  <link rel="stylesheet" href="../styles/main.css" />
</head>
<body>

  <div class="auth-shell">
    <div class="auth-topbar">
      <div class="app-brand-name">VideoTool</div>
      <button class="theme-toggle" id="theme-toggle" aria-pressed="false">Modo escuro</button>
    </div>

    <div class="auth-body">
      <div class="card auth-box">
        <h1 class="auth-title">Criar conta</h1>
        <p class="auth-subtitle">Leva menos de um minuto</p>

        <form id="register-form">
          <div class="field">
            <label for="name-input">Nome</label>
            <input type="text" id="name-input" name="name" required placeholder="Seu nome" />
          </div>

          <div class="field">
            <label for="email-input">E-mail</label>
            <input type="email" id="email-input" name="email" required placeholder="voce@exemplo.com" />
          </div>

          <div class="field">
            <label for="password-input">Senha</label>
            <input type="password" id="password-input" name="password" required placeholder="••••••••" />
          </div>

          <div class="field">
            <label for="confirm-password-input">Confirmar senha</label>
            <input type="password" id="confirm-password-input" name="confirmPassword" required placeholder="••••••••" />
          </div>

          <p class="form-error" id="register-error" role="alert" hidden></p>

          <button type="submit" class="btn btn-primary btn-block" id="register-btn">Criar conta</button>
        </form>

        <div class="divider"></div>

        <p class="auth-footer-text">
          Já tem conta? <a href="login.html">Entrar</a>
        </p>
      </div>
    </div>
  </div>

  <script src="../scripts/theme.js"></script>
  <script src="../scripts/api-client.js"></script>
  <script>
    const EMAIL_REGEX = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const form = document.getElementById("register-form");
    const errorBox = document.getElementById("register-error");
    const submitButton = document.getElementById("register-btn");

    function showError(message) {
      errorBox.textContent = message;
      errorBox.hidden = false;
    }

    function clearError() {
      errorBox.textContent = "";
      errorBox.hidden = true;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearError();

      const name = document.getElementById("name-input").value.trim();
      const email = document.getElementById("email-input").value.trim();
      const password = document.getElementById("password-input").value;
      const confirmPassword = document.getElementById("confirm-password-input").value;

      if (name.length < 2) return showError("Informe seu nome.");
      if (!EMAIL_REGEX.test(email)) return showError("Por favor, insira um e-mail válido.");
      if (password.length < 8) return showError("A senha deve ter pelo menos 8 caracteres.");
      if (password !== confirmPassword) return showError("As senhas não conferem.");

      const originalLabel = submitButton.textContent;
      submitButton.disabled = true;
      submitButton.textContent = "Criando conta...";

      try {
        // O cadastro ja devolve o token: a pessoa entra logada.
        const { token } = await apiRequest("/api/auth/register", {
          method: "POST",
          body: { name, email, password },
        });
        setToken(token);
        window.location.href = "../Studio/Video.html";
      } catch (error) {
        showError(error.message);
        submitButton.disabled = false;
        submitButton.textContent = originalLabel;
      }
    });
  </script>
</body>
</html>
