<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar senha · VideoTool</title>
  <link rel="stylesheet" href="../styles/main.css" />
</head>
<body>

  <div class="auth-shell">
    <div class="auth-topbar">
      <div class="app-brand-name">VideoTool</div>
      <button class="theme-toggle" id="theme-toggle" aria-pressed="false">Modo escuro</button>
    </div>

    <div class="auth-body">
      <div class="card auth-box">
        <h1 class="auth-title">Recuperar senha</h1>
        <p class="auth-subtitle">Enviaremos um link de redefinição para o seu e-mail</p>

        <form id="lost-password-form">
          <div class="field">
            <label for="email-input">E-mail</label>
            <input type="email" id="email-input" name="email" required placeholder="voce@exemplo.com" />
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="send-reset-btn">Enviar link</button>
        </form>

        <p class="auth-footer-text" id="reset-feedback" hidden>
          Se o e-mail existir, um link de redefinição foi enviado.
        </p>

        <div class="divider"></div>

        <p class="auth-footer-text">
          Lembrou a senha? <a href="login.html">Entrar</a>
        </p>
      </div>
    </div>
  </div>

  <script src="../scripts/theme.js"></script>
  <script>
    // TODO: implementar o envio real do e-mail de redefinição de senha.
    document.getElementById("lost-password-form").addEventListener("submit", (event) => {
      event.preventDefault();
      // TODO: chamar o back-end para gerar e enviar o link de redefinição.
      document.getElementById("reset-feedback").hidden = false;
    });
  </script>
</body>
</html>
