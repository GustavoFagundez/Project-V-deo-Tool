<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar · VideoTool</title>
  <link rel="stylesheet" href="../styles/main.css" />
</head>
<body>

  <div class="auth-shell">
    <div class="auth-topbar">
      <div class="app-brand-name">VideoTool</div>
      <button class="theme-toggle" id="theme-toggle" aria-pressed="false">Modo escuro</button>
    </div>

    <div class="auth-body">
      <div class="card auth-box">
        <h1 class="auth-title">Entrar</h1>
        <p class="auth-subtitle">Acesse sua conta para continuar</p>

        <form id="login-form">
          <div class="field">
            <label for="email-input">E-mail</label>
            <input type="email" id="email-input" name="email" required placeholder="voce@exemplo.com" />
          </div>

          <div class="field">
            <label for="password-input">Senha</label>
            <input type="password" id="password-input" name="password" required placeholder="••••••••" />
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="login-btn">Entrar</button>
        </form>

        <p class="auth-footer-text">
          <a href="lost_password.html">Esqueci minha senha</a>
        </p>

        <div class="divider"></div>

        <p class="auth-footer-text">
          Ainda não tem conta? <a href="register.html">Criar conta</a>
        </p>
      </div>
    </div>
  </div>

  <script src="../scripts/theme.js"></script>
  <script>
    // TODO: implementar a autenticação real (chamada ao back-end / banco de dados).
    document.getElementById("login-form").addEventListener("submit", (event) => {
      event.preventDefault();
      // TODO: validar credenciais e redirecionar para "../Studio/Video.html" em caso de sucesso.
    });
  </script>
</body>
</html>
