<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar · VideoTool</title>
  <link rel="stylesheet" href="../styles/main.css" />
</head>
<body>

  <div class="auth-shell">
    <div class="auth-topbar">
      <div class="app-brand-name">VideoTool</div>
      <button class="theme-toggle" id="theme-toggle" aria-pressed="false">Modo escuro</button>
    </div>

    <div class="auth-body">
      <div class="card auth-box">
        <h1 class="auth-title">Entrar</h1>
        <p class="auth-subtitle">Acesse sua conta para continuar</p>

        <form id="login">
          <div class="field">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required placeholder="voce@exemplo.com" />
          </div>

          <div class="field">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" required placeholder="••••••••" />
          </div>

          <p class="form-error" id="login-error" role="alert" hidden></p>

          <button type="submit" class="btn btn-primary btn-block" id="login-btn">Entrar</button>
        </form>

        <p class="auth-footer-text">
          <a href="lost_password.html">Esqueci minha senha</a>
        </p>

        <div class="divider"></div>

        <p class="auth-footer-text">
          Ainda não tem conta? <a href="register.html">Criar conta</a>
        </p>
      </div>
    </div>
  </div>

  <script src="../scripts/theme.js"></script>
  <script src="../scripts/api-client.js"></script>
  <script>
    const EMAIL_REGEX = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const form = document.getElementById("login");
    const errorBox = document.getElementById("login-error");
    const submitButton = document.getElementById("login-btn");

    function showError(message) {
      errorBox.textContent = message;
      errorBox.hidden = false;
    }

    function clearError() {
      errorBox.textContent = "";
      errorBox.hidden = true;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearError();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!EMAIL_REGEX.test(email)) return showError("Por favor, insira um e-mail válido.");
      if (password.length < 8) return showError("A senha deve ter pelo menos 8 caracteres.");

      const originalLabel = submitButton.textContent;
      submitButton.disabled = true;
      submitButton.textContent = "Entrando...";

      try {
        const { token } = await apiRequest("/api/auth/login", {
          method: "POST",
          body: { email, password },
        });
        setToken(token);
        window.location.href = "../Studio/Video.html";
      } catch (error) {
        showError(error.message);
        submitButton.disabled = false;
        submitButton.textContent = originalLabel;
      }
    });
  </script>
</body>
</html>
